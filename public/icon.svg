<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Shield Ring -->
  <path d="M256 64 C350 100 400 120 400 240 C400 340 320 410 256 448 C192 410 112 340 112 240 C112 120 162 100 256 64 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="12" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner Safe Route Path -->
  <!-- Start Point (Current Location Pulse) -->
  <circle cx="180" cy="330" r="16" fill="#38bdf8" />
  <circle cx="180" cy="330" r="28" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.5"/>

  <!-- Ramp/Path Line S-Curve representing step-free accessible navigation -->
  <path d="M180 330 C 210 280, 200 220, 256 210 C 310 200, 330 160, 332 130" 
        fill="none" 
        stroke="url(#routeGrad)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-dasharray="1 1"/>

  <!-- Ramp Incline Angle icon / Step-free symbol -->
  <path d="M220 280 L290 240 L290 280 Z" fill="#10b981" opacity="0.85"/>

  <!-- Destination Pin -->
  <g transform="translate(332, 130)">
    <circle cx="0" cy="0" r="18" fill="#10b981" />
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
  </g>

  <!-- Accessibility Wheelchair / Human Symbol -->
  <circle cx="256" cy="130" r="14" fill="#60a5fa"/>
  <path d="M250 150 C265 150 274 158 274 172 L274 195 M256 168 L286 168" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" fill="none"/>
</svg>
